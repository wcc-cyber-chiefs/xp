name: join

# Runs when someone opens the "Join XP" issue form. The username always comes from the
# issue author, so nobody can sign someone else up.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: xp-ledger
  cancel-in-progress: false

jobs:
  join:
    if: contains(github.event.issue.labels.*.name, 'xp-join')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Add member
        env:
          BODY: ${{ github.event.issue.body }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.txt"
          python scripts/xp.py join --user "$AUTHOR" --body-file "$RUNNER_TEMP/body.txt" --reply-file "$RUNNER_TEMP/reply.md"
      - name: Commit
        run: |
          if git diff --quiet data/; then exit 0; fi
          git config user.name "cyber-chiefs-xp[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/members.json
          git commit -m "xp: ${{ github.event.issue.user.login }} joined"
          git push
          echo "CHANGED=1" >> "$GITHUB_ENV"
      - name: Reply, close, rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          if [ "${CHANGED:-0}" = "1" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
